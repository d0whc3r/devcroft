# Build and push the warm CI base image (Dockerfile.ci) to ghcr.io.
#
# PURPOSE: release.yml's build matrix used to spend ~2-3 min per job on apt
# packages, rustup target adds, and `cargo install cargo-zigbuild` (~6 min
# total across the 2 matrix jobs when they run in parallel). This workflow
# bakes all of that into ONE linux/amd64 image, ghcr.io/d0whc3r/devcroft-ci,
# and tags it with the exact mise.toml pins so drift can't be silent:
#
#     ghcr.io/<owner>/devcroft-ci:rust<RUST_PIN>-zig<ZIG_PIN>
#     ghcr.io/<owner>/devcroft-ci:latest
#
# The tag is derived from mise.toml here (same awk parse release.yml uses), so
# bumping a pin in mise.toml yields a new tag automatically — but remember the
# Dockerfile.ci layer itself hard-asserts the same pins, so a mise.toml bump
# that is not mirrored into Dockerfile.ci fails at image build time.
#
# SINGLE-ARCH: the image is linux/amd64 only. No per-arch images are needed —
# zig performs cross-compilation to every target entirely from linux-x64.
#
# PUBLIC IMAGE: this repo is public, so GHCR packages published from it are
# public automatically; pulling by the release workflow (and the final gate
# step below) is anonymous, free, and typically fast. No secrets, credentials,
# or SDKs are baked into the image (the macOS SDK is fetched per run by
# release.yml, never vendored).
#
# MULTIDARCH: linux/amd64 only (see above). No setup for buildx multiarch
# platforms beyond that; buildx is still used for its efficient layer caching.
#
# CACHE: type=gha buildkit cache means tag bumps that only change the last
# layers (e.g. cargo-zigbuild version) reuse the big apt/rustup/zig layers.

name: CI image

on:
  # Manual builds let us warm the image for a pending release.yml change.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.ci"
      - "mise.toml"
      - ".github/workflows/ci-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build and push devcroft-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Single source of truth for tool pins: [tools] in mise.toml.
      # awk stops at the first matching line inside [tools]; -F'"' picks
      # the first-quoted field (version for rust and zig).
      - name: Derive image tag from mise.toml pins
        run: |
          set -euo pipefail
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          rust_pin="$(awk -F'"' '/^\[tools\]/{t=1;next} t&&/rust[ =]/{print $2; exit}' mise.toml)"
          zig_pin="$(awk -F'"' '/^\[tools\]/{t=1;next} t&&/zig[ =]/{print $2; exit}' mise.toml)"
          [ -n "$rust_pin" ] || { echo "error: could not parse rust pin from mise.toml" >&2; exit 1; }
          [ -n "$zig_pin" ] || { echo "error: could not parse zig pin from mise.toml" >&2; exit 1; }
          echo "owner=$owner_lc" >> "$GITHUB_ENV"
          echo "rust_pin=$rust_pin" >> "$GITHUB_ENV"
          echo "zig_pin=$zig_pin" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${owner_lc}/devcroft-ci:rust${rust_pin}-zig${zig_pin}" >> "$GITHUB_ENV"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.image }}
            ghcr.io/${{ env.owner }}/devcroft-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Post-push gate: the pushed tag's zig must match the mise.toml pin.
      # (Rust/zigbuild pins are asserted inside Dockerfile.ci's last layer;
      # this runs the freshly pushed image to also catch pull/registry issues.)
      - name: Verify pushed image (zig version matches pin)
        run: |
          set -euo pipefail
          got="$(docker run --rm "$image" zig version)"
          [ "$got" = "$zig_pin" ] || { echo "error: pushed image zig version '$got' ≠ mise.toml pin '$zig_pin'" >&2; exit 1; }
          echo "pushed image OK: $image (zig $got)"
