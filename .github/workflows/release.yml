# Release pipeline for Devcroft.
#
# Triggered by `v*` tags and manual dispatch. Builds the release `devcroft`
# binary for the two supported targets, packages each as a plain
# devcroft-<os>-<arch>.tar.gz (containing only the `devcroft` binary), and
# publishes one GitHub Release with all tarballs plus a single SHA256SUMS
# file. The repo-root install.sh consumes exactly this layout.
#
# SINGLE-RUNNER CROSS-COMPILATION: every target is built on ONE ubuntu-24.04
# runner via cargo-zigbuild (native for x86_64 Linux, cross for everything
# else). This replaces the old four-native-runner matrix (macos-14,
# macos-13, ubuntu-24.04, ubuntu-24.04-arm).
#
# WARM-IMAGE TOOLCHAINS: the toolchain stack (apt build deps, rust 1.97.1 with
# both rust targets preinstalled, zig 0.16.0, cargo-zigbuild 0.23.4) is baked
# into a warm docker image built by .github/workflows/ci-image.yml and pushed
# to ghcr.io/d0whc3r/devcroft-ci, tagged rust<r>-zig<z> derived from mise.toml
# pins — the SAME pins release.yml checks at run time:
#
#   rust = 1.97.1 (mise.toml)  → RUST_PIN
#   zig = 0.16.0 (mise.toml)   → ZIG_PIN (mise) / CARGO_ZIGBUILD_VERSION (here)
#   cargo-zigbuild 0.23.4      → image default; verified combination is
#                                cargo-zigbuild 0.23.4 + rust 1.97.1 + zig 0.16.0
#
# Verified combination is cargo-zigbuild 0.23.4 + rust 1.97.1 + zig 0.16.0.
# Zig is required at build time: the libghostty-vt-sys dependency compiles its
# VT core from Zig sources, and .cargo/config.toml sets LIBGHOSTTY_VT_SYS_OPTIMIZE
# so it builds in ReleaseFast.
#
# Target matrix (only the two distributions the repo owner wants):
#   - x86_64-unknown-linux-gnu   (native, but built with the same
#     `cargo zigbuild` command for uniformity)
#   - aarch64-apple-darwin       (cross via cargo-zigbuild + macOS SDK)
#
# APPLE-SDK GATEWAY: darwin targets need a macOS SDK. We pull the public
# phracker/MacOSX-SDKs 11.3 tarball per run — it is never vendored/committed
# to this repo. This is tolerated but at DMCA risk: the SDK is Apple-
# proprietary, so do NOT redistribute it (no artifact caching of the SDK
# tarball, nothing SDK-derived in the uploaded assets beyond the binary
# itself). Safe harbor depends on the run-once, no-redistribution model.
#
# RISK LIST (from cross-compilation research):
# - (a) darwin framework linking from Linux is the #1 risk. Mitigation:
#   cargo-zigbuild 0.23.4 writes .tbd stubs from SDKROOT and passes `-F`
#   framework search paths itself for zig >= 0.15. Expect the first darwin
#   cross build to be the most likely failure point.
# - (b) libghostty-vt-sys double-zig: the build script looks for zig on
#   PATH. mise provides zig; cargo-zigbuild prepends its own zig shim but
#   respects a mise-installed zig. If the build script builds against the
#   wrong zig (or fails to find it), check the diagnostic step output.
# - (c) codesign: darwin assets produced by cross CI are unsigned. End
#   users may need `xattr -d com.apple.quarantine` after installing on
#   macOS (Gatekeeper will see no signature).
#
# NOTES / WARNINGS:
# - The CLI and the GPUI desktop app are the same crate and binary, so each
#   job builds the whole workspace; nothing app-only is packaged.
# - Linux build-system deps (clang, libclang-dev, cmake, ninja-build,
#   pkg-config, libfontconfig1-dev, libfreetype-dev) now live inside the warm
#   CI image (see Dockerfile.ci); the runner no longer runs apt at all.
# - FUTURE OPTIMIZATION (not implemented here): rust-cache / caching the
#   workspace target/ between runs would shave further minutes; out of scope
#   for the warm-image change.
# - Asset names must stay exactly as install.sh's detect_platform expects:
#   x86_64-unknown-linux-gnu → devcroft-linux-x86_64.tar.gz
#   aarch64-apple-darwin → devcroft-darwin-arm64.tar.gz
# - On workflow_dispatch, the `targets` input optionally limits the matrix
#   to a space-separated subset of triples (e.g. "x86_64-unknown-linux-gnu
#   aarch64-apple-darwin"); a `filter` job reduces the matrix to JSON.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and release (e.g. v0.2.1); empty builds the current branch"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        type: boolean
        default: false
      targets:
        description: "Optional space-separated subset of triples to build (default: both targets)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Verified pairing with mise.toml's rust 1.97.1 / zig 0.16.0.
  CARGO_ZIGBUILD_VERSION: 0.23.4

jobs:
  # Reduce the full 4-target matrix to JSON according to the dispatch
  # `targets` input (empty = all). Push-tag runs always get the full set.
  filter:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute matrix JSON
        id: matrix
        env:
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || '' }}
        run: |
          full='[
            { "triple": "x86_64-unknown-linux-gnu",  "asset": "devcroft-linux-x86_64.tar.gz",  "sdk": false },
            { "triple": "aarch64-apple-darwin",      "asset": "devcroft-darwin-arm64.tar.gz",  "sdk": true  }
          ]'
          set -euo pipefail
          if [ -z "${TARGETS// /}" ]; then
            selected="$(echo "$full" | jq -c .)"
          else
            selected="$(echo "$full" | jq -c --arg t "$TARGETS" '
              [ .[] | select(.triple as $tr | $t | split(" ") | index($tr)) ]')"
          fi
          # Always single-line compact JSON — GITHUB_OUTPUT does not support
          # multi-line values on a plain echo.
          echo "selected targets: $selected"
          if [ "$selected" = "[]" ]; then
            echo "error: no targets matched the filter (targets='$TARGETS')" >&2
            exit 1
          fi
          # strategy.matrix consumes {"include": [...]}, not a bare array.
          echo "matrix=$(echo "$selected" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # WARM-IMAGE BUILD FLOW (replaces per-run mise + rustup target + apt +
  # cargo install cargo-zigbuild):
  #
  #   1. checkout (full history, unchanged)
  #   2. parse the tool pins out of mise.toml → compose the image tag
  #      ghcr.io/<owner>/devcroft-ci:rust<RUST_PIN>-zig<ZIG_PIN>
  #      (the exact tag convention .github/workflows/ci-image.yml pushes)
  #   3. darwin targets keep the per-run macOS SDK fetch — THE SDK STAYS
  #      ON THE RUNNER WORKSPACE, outside docker; it is never baked into
  #      the image (Apple forbids redistribution)
  #   4. the build itself runs INSIDE the warm image via an explicit
  #      `docker run --rm -v $GITHUB_WORKSPACE:/workspace ...` that
  #      hard-fails first on any pin drift between image and mise.toml,
  #      then runs `cargo zigbuild --release --locked --target <triple>`
  #      with diagnostics always emitted after the build attempt
  #   5. package/checksum/upload stay on the runner, unchanged
  #
  # WHY NO `container:` KEY on the job: the explicit docker run keeps
  # workspace ownership and path semantics under our control (GitHub's
  # `container:` wiring fights checkout/workspace ownership and adds
  # docker-file ipc fiddling for registry auth).
  #
  # USER MAPPING (uid 1001): on GitHub-hosted ubuntu-24.04 runners the
  # checkout lives under the runner user (uid 1001). The warm image's
  # non-root `builder` user is created with uid/gid 1001 exactly so
  # `--user 1001:1001` matches. cargo writes target/ INSIDE the mounted
  # workspace; the owning directory is owned by runner uid 1001, and the
  # container process is uid 1001 → it has owner write permission.
  # A uid mismatch would break writes into the mounted workspace and any
  # release run would fail loudly on the first cargo create() in target/.
  #
  # WARMTH NOTE: the image's baked CARGO_HOME carries the registry index,
  # .crate cache and the preinstalled cargo-zigbuild binary. Compilation of
  # dependencies always lands in <workspace>/target/ (never CARGO_HOME), so a
  # workspace target/ snapshot is intentionally NOT part of the image;
  # caching target/ between runs (rust-cache) is a separate future item.
  #
  # No GITHUB_* env vars are passed into the build: the mounted .git
  # checkout satisfies any git-derived version info, and cargo needs none.
  # ------------------------------------------------------------------
  build:
    name: build ${{ matrix.asset }} (${{ matrix.triple }})
    needs: filter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.filter.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so any tag-based versioning stays clean.
          fetch-depth: 0
          fetch-tags: true
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}"

      # Derive the warm image tag from the SAME mise.toml pins ci-image.yml
      # uses, so a release build always points at the tag matching this
      # branch's tool versions (dots are legal in docker tags).
      - name: Derive warm image tag from mise.toml pins
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          rust_pin="$(awk -F'"' '/^\[tools\]/{t=1;next} t&&/rust[ =]/{print $2; exit}' mise.toml)"
          zig_pin="$(awk -F'"' '/^\[tools\]/{t=1;next} t&&/zig[ =]/{print $2; exit}' mise.toml)"
          [ -n "$rust_pin" ] || { echo "error: could not parse rust pin from mise.toml" >&2; exit 1; }
          [ -n "$zig_pin" ] || { echo "error: could not parse zig pin from mise.toml" >&2; exit 1; }
          echo "RUST_PIN=$rust_pin" >> "$GITHUB_ENV"
          echo "ZIG_PIN=$zig_pin" >> "$GITHUB_ENV"
          echo "CI_IMAGE=ghcr.io/${owner_lc}/devcroft-ci:rust${rust_pin}-zig${zig_pin}" >> "$GITHUB_ENV"

      # Public GHCR image from a public repo: anonymous pull, free + fast.
      # Warm pull ~= the time the old apt+rustup+cargo-install steps took;
      # cached builds re-pull deduped layers, often sub-30s.
      - name: Pull warm CI image (${{ env.CI_IMAGE }})
        run: docker pull "$CI_IMAGE"

      # APPLE-SDK GATEWAY: fetched per run into the runner workspace, never
      # committed and never baked into the image (licensing caveat in the
      # file header). Passed into the container below as
      # SDKROOT=/workspace/MacOSX11.3.sdk, the mount-side path.
      - name: Fetch macOS SDK (darwin targets only)
        if: matrix.sdk
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz \
            | tar -Jx -C "$GITHUB_WORKSPACE"

      # Build inside the warm image. Order within the container: pin-drift
      # validation (hard fail on any mismatch), then the build, then
      # diagnostics ALWAYS (the old `if: failure()` step folded in, so a
      # failed build still prints which zig/zigbuild/SDKROOT were visible).
      - name: Build release binary inside warm image (cargo zigbuild)
        env:
          TRIPLE: ${{ matrix.triple }}
          SDK_ENABLED: ${{ matrix.sdk }}
        run: |
          set -uo pipefail
          docker_args=(
            --rm -i
            --user 1001:1001
            -v "$GITHUB_WORKSPACE:/workspace"
            --workdir /workspace
            -e TARGET="$TRIPLE"
            -e RUST_PIN="$RUST_PIN"
            -e ZIG_PIN="$ZIG_PIN"
            -e CARGO_ZIGBUILD_VERSION="$CARGO_ZIGBUILD_VERSION"
          )
          if [ "$SDK_ENABLED" = "true" ]; then
            docker_args+=( -e SDKROOT=/workspace/MacOSX11.3.sdk )
          fi
          docker run "${docker_args[@]}" "$CI_IMAGE" bash -s <<'EOF'
            set -u
            status=0
            echo "=== toolchain inspection ==="
            echo "zig:     $(which zig)   $(zig version)"
            echo "rustc:   $(which rustc)   $(rustc --version)"
            echo "zigbuild: $(which cargo-zigbuild)   $(cargo-zigbuild --version)"
            echo "SDKROOT: ${SDKROOT:-<unset>}"

            echo "=== pin validation (mise.toml: rust=$RUST_PIN zig=$ZIG_PIN zigbuild=$CARGO_ZIGBUILD_VERSION) ==="
            if ! zig version | grep -qx "$ZIG_PIN"; then
              echo "::error::zig pin drift: expected $ZIG_PIN, got $(zig version)"; status=1
            fi
            if ! rustc --version | grep -qE "^rustc ${RUST_PIN} "; then
              echo "::error::rustc pin drift: expected rustc $RUST_PIN, got $(rustc --version)"; status=1
            fi
            if ! cargo-zigbuild --version | grep -qE "^cargo-zigbuild ${CARGO_ZIGBUILD_VERSION}[[:space:]]*$"; then
              echo "::error::cargo-zigbuild pin drift: expected $CARGO_ZIGBUILD_VERSION, got $(cargo-zigbuild --version)"; status=1
            fi
            if ! rustup target list --installed | grep -qx "$TARGET"; then
              echo "::error::rust target not installed in image: $TARGET"; status=1
            fi
            [ "$status" -eq 0 ] || exit "$status"

            # Linux-gnu: zigbuild defaults to glibc 2.17 stubs, but the ubuntu-24.04
            # system libs we link (libxkbcommon etc.) reference glibc >= 2.38
            # symbols (e.g. __isoc23_strtoul@GLIBC_2.38) that 2.17 stubs lack.
            # Pinning .2.38 defines those symbols in the linker stub map.
            case "$TARGET" in
              *-linux-gnu) ZIG_TARGET="$TARGET.2.38" ;;
              *)           ZIG_TARGET="$TARGET" ;;
            esac
            echo "=== cargo zigbuild --release --locked --target $ZIG_TARGET ==="
            cargo zigbuild --release --locked --target "$ZIG_TARGET"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::warning::cargo zigbuild failed (status=$status) — diagnostics follow"
              echo "which zig  : $(which zig)"; zig version
              echo "cargo-zigbuild: $(which cargo-zigbuild)   $(cargo-zigbuild --version)"
              echo "SDKROOT: ${SDKROOT:-<unset>}"
              exit "$status"
            fi

            echo "=== post-build diagnostics ==="
            echo "zig version      : $(zig version)"
            echo "cargo zigbuild   : $(cargo-zigbuild --version)"
            echo "SDKROOT          : ${SDKROOT:-<unset>}"
            echo "built binary     : $(ls -l "target/$TARGET/release/devcroft")"
          EOF

      - name: Package asset
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          tar -czf "$asset" -C "target/${{ matrix.triple }}/release" devcroft

      - name: Checksum asset
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          # sha256sum default format is "<sha256>  <file>" (two spaces), which
          # is exactly what install.sh greps for and what the SHA256SUMS
          # aggregation in the release job concatenates.
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    # Publish only for real v* tags / refs. Dispatch test runs (empty ref or
    # a branch ref) produce artifacts only, never a partial release.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.ref, 'v'))
    steps:
      - name: Derive tag and prerelease flag
        id: release_meta
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          DEFAULT_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_REF:-$DEFAULT_TAG}"
          pre="$INPUT_PRERELEASE"
          # Prerelease is explicit via dispatch, or inferred from a
          # prerelease suffix in the tag itself (e.g. v0.2.1-rc1).
          if [ "$pre" != "true" ]; then
            case "$tag" in
              *-*) pre="true" ;;
              *) pre="false" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "release meta: tag=$tag prerelease=$pre"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        run: |
          cat dist/devcroft-*.tar.gz.sha256 > dist/SHA256SUMS
          rm -f dist/devcroft-*.tar.gz.sha256
          cat dist/SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/devcroft-*.tar.gz
            dist/SHA256SUMS

    # NOTE: release consumers (install.sh) only see the published assets, so
    # a dispatch run with a reduced `targets` input yields a release with a
    # subset of assets — intended for testing, not for publishing.
